<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REQOR</title>
<style>
  :root{--red:#d32f2f;--dark:#1f2937;--bg:#f3f4f6;--line:#d1d5db;--ok:#16a34a}
  *{box-sizing:border-box}
  body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--dark)}
  header{background:var(--red);color:#fff;text-align:center;padding:18px 10px;font-size:28px;font-weight:700;letter-spacing:6px}
  main{max-width:640px;margin:20px auto;padding:0 14px 40px}
  .card{background:#fff;border-radius:10px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.12);margin-bottom:16px}
  label{display:block;font-weight:600;margin:12px 0 4px;font-size:14px}
  label .req{color:var(--red);font-weight:700}
  input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;font-size:15px;font-family:inherit;background:#fff}
  input:focus,select:focus,textarea:focus{outline:2px solid #fca5a5;border-color:var(--red)}
  .err{border-color:var(--red)!important;background:#fef2f2}
  button{border:0;border-radius:6px;padding:11px 20px;font-size:15px;font-weight:600;cursor:pointer;color:#fff}
  .gen{background:var(--red);margin-top:18px;width:100%}
  .copy{background:var(--ok);margin-top:10px;width:100%}
  .clear{background:#6b7280;margin-top:10px;width:100%}
  .hidden{display:none}
  #hasil{min-height:220px;font-family:Consolas,monospace;font-size:14px;line-height:1.5}
  .msg{color:var(--red);font-size:13px;margin-top:10px;min-height:16px}
  .combo{position:relative}
  .list{position:absolute;left:0;right:0;top:100%;z-index:10;background:#fff;border:1px solid var(--line);border-radius:6px;max-height:240px;overflow-y:auto;box-shadow:0 4px 10px rgba(0,0,0,.15)}
  .list div{padding:8px 10px;font-size:14px;cursor:pointer;border-bottom:1px solid #f0f0f0}
  .list div:hover,.list div.act{background:#fee2e2}
  .list div.none{color:#888;cursor:default}
</style>
</head>
<body>
<header>REQOR</header>
<main>
  <div class="card">
    <label for="mode">PILIH FORMAT</label>
    <select id="mode">
      <option value="">-- Pilih --</option>
      <option value="OPEN">OPEN TIKET</option>
      <option value="CLOSE">CLOSE TIKET</option>
    </select>

    <!-- FORM OPEN -->
    <form id="formOpen" class="hidden" autocomplete="off" onsubmit="return false">
      <label>STO <span class="req">* Wajib</span></label>
      <input id="o_sto" placeholder="Contoh: CJR">
      <label>ODC</label>
      <input id="o_odc" placeholder="Contoh: ODC-CJR-FBC">
      <label>ODP</label>
      <input id="o_odp">
      <label>PENYEBAB <span class="req">* Wajib</span></label>
      <textarea id="o_penyebab" rows="2" placeholder="Contoh: KU 12 CORE TERTARIK KENDARAAN"></textarea>
      <label>ESTIMASI</label>
      <input id="o_estimasi" placeholder="Contoh: 10 jam">
      <label>PIC</label>
      <input id="o_pic" placeholder="Contoh: John-08123123123">
      <label>Classification</label>
      <input id="o_class" placeholder="Contoh: Z_NEW_MANUAL_GAMAS_002_004_001_004">
      <label>KODE REQ</label>
      <input id="o_req" placeholder="Contoh: REQ-008123">
      <button type="button" class="gen" onclick="genOpen()">GENERATE</button>
      <button type="button" class="clear" onclick="clearAll()">CLEAR</button>
    </form>

    <!-- FORM CLOSE -->
    <form id="formClose" class="hidden" autocomplete="off" onsubmit="return false">
      <label>TIKET <span class="req">* Wajib</span></label>
      <input id="c_tiket" placeholder="Contoh: INC53796151">
      <label>PENYEBAB <span class="req">* Wajib</span></label>
      <textarea id="c_penyebab" rows="2" placeholder="Contoh: KU 12 CORE TERTARIK KENDARAAN"></textarea>
      <label>KODE ACTSOL <span class="req">* Wajib</span></label>
      <div class="combo">
        <input id="c_act" placeholder="Ketik kode atau nama, lalu pilih">
        <div id="actList" class="list hidden"></div>
      </div>
      <div id="domWrap" class="hidden">
        <label>INCIDENT DOMAIN</label>
        <input id="c_domain" readonly>
      </div>
      <label>PENYAMBUNGAN</label>
      <select id="c_sambung">
        <option value="">-- Pilih --</option>
        <option>[LANG]</option>
        <option>[TEMP]</option>
      </select>
      <label>PERBAIKAN / RFO <span class="req">* Wajib</span></label>
      <textarea id="c_rfo" rows="3" placeholder="Contoh: Sambung KU 12 Core"></textarea>
      <button type="button" class="gen" onclick="genClose()">GENERATE</button>
      <button type="button" class="clear" onclick="clearAll()">CLEAR</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card hidden" id="outCard">
    <label for="hasil">Hasil</label>
    <textarea id="hasil" readonly></textarea>
    <button type="button" class="copy" id="btnCopy" onclick="salin()">SALIN TEXT</button>
    <button type="button" class="clear" onclick="clearAll()">CLEAR</button>
  </div>
</main>

<script>
const ACTSOL = [
"ASGMS028 GAMAS - FEEDER - CHANGE CORE FEEDER",
"ASGMS029 GAMAS - FEEDER - GANTI KT FEEDER",
"ASGMS030 GAMAS - FEEDER - GANTI KU FEEDER",
"ASGMS033 GAMAS - FEEDER - PENYAMBUNGAN KT FEEDER",
"ASGMS035 GAMAS - FEEDER - REROUTE FEEDER",
"58690 GAMAS - FEEDER - SAMBUNG FO",
"ASGMS017 GAMAS - DISTRIBUSI - GANTI KT DISTRIBUSI",
"ASGMS019 GAMAS - DISTRIBUSI - PELURUSAN CORE DISTRIBUSI",
"ASGMS020 GAMAS - DISTRIBUSI - PENYAMBUNGAN KT DISTRIBUSI",
"ASGMS022 GAMAS - DISTRIBUSI - PENYAMBUNGAN ULANG CORE DI BRANCHING",
"ASGMS023 GAMAS - DISTRIBUSI - PENYAMBUNGAN ULANG CORE DI JOINT DISTRIBUSI",
"ASGMS096  GAMAS - DISTRIBUSI - GANTI/PERBAIKAN TIANG",
"58686 GAMAS - DISTRIBUSI - REROUTE & SAMBUNG FO",
"58687 GAMAS - DISTRIBUSI - SAMBUNG FO",
"58709 GAMAS - ODP - GANTI ADAPTOR",
"ASGMS063 GAMAS - ODP - GANTI ADAPTOR ODP",
"ASGMS064 GAMAS - ODP - GANTI ODP",
"ASGMS065 GAMAS - ODP - GANTI PIGTAIL ODP",
"ASGMS066 GAMAS - ODP - GANTI SPLITTER 1:4 ODP",
"ASGMS067 GAMAS - ODP - GANTI SPLITTER 1:8 ODP",
"ASGMS068 GAMAS - ODP - PENARIKAN DROPCORE",
"ASGMS069 GAMAS - ODP - PENYAMBUNGAN ULANG CORE DI ODP",
"ASGMS070 GAMAS - ODP - PERAPIHAN DI ODP",
"58712 GAMAS - ODP - PERBAIKAN CONECTOR",
"GAMAS004 GAMAS - ODC",
"ASGMS051 GAMAS - ODC - GANTI ADAPTOR ODC",
"ASGMS052 GAMAS - ODC - GANTI ODC",
"ASGMS053 GAMAS - ODC - GANTI PATCHCORE ODC",
"ASGMS054 GAMAS - ODC - GANTI PIGTAIL ODC",
"ASGMS055 GAMAS - ODC - GANTI SPLITTER 1:4 ODC",
"ASGMS056 GAMAS - ODC - GANTI SPLITTER 1:8 ODC",
"ASGMS057 GAMAS - ODC - JUMPER ULANG DI ODC",
"58706 GAMAS - ODC - PEMBERSIHAN ADAPTER & CONECTOR",
"ASGMS058 GAMAS - ODC - PEMBERSIHAN PATCHCORE ODC",
"ASGMS059 GAMAS - ODC - PENYAMBUNGAN ULANG CORE DI ODC",
"ASGMS060 GAMAS - ODC - PERAPIHAN DI ODC",
"58707 GAMAS - ODC - PERBAIKAN CONECTOR",
"ASGMS082 GAMAS - OLT - PLN ON",
"CANCEL"
];

const $ = id => document.getElementById(id);
const mode = $("mode"), msg = $("msg"), outCard = $("outCard"), hasil = $("hasil");
const val = id => $(id).value.trim();
const up = id => val(id).toUpperCase();
/* Tanda untuk teks monospace (Telegram). Ubah ke "`" jika ingin satu backtick. */
const BT = "`";
const mono = t => t ? BT + t + BT : "";

mode.addEventListener("change", () => {
  $("formOpen").classList.toggle("hidden", mode.value !== "OPEN");
  $("formClose").classList.toggle("hidden", mode.value !== "CLOSE");
  outCard.classList.add("hidden");
  msg.textContent = "";
  document.querySelectorAll(".err").forEach(e => e.classList.remove("err"));
});

function cek(ids) {
  let ok = true;
  ids.forEach(id => {
    const bad = !val(id);
    $(id).classList.toggle("err", bad);
    if (bad) ok = false;
  });
  msg.textContent = ok ? "" : "Lengkapi kolom bertanda * Wajib.";
  return ok;
}

function tampil(teks) {
  hasil.value = teks;
  outCard.classList.remove("hidden");
  $("btnCopy").textContent = "SALIN TEXT";
  outCard.scrollIntoView({behavior: "smooth", block: "nearest"});
}

function genOpen() {
  if (!cek(["o_sto", "o_penyebab"])) return;
  tampil(
`Moban open kak @survSO2_1

${mono(up("o_req"))}
**STO :** ${up("o_sto")}
**Datek Terdampak (ODC):** ${up("o_odc")}
**Datek Terdampak (ODP):** ${up("o_odp")}
**Penyebab:** ${up("o_penyebab")}
**Estimasi:** ${up("o_estimasi")}
**PIC:** ${up("o_pic")}
**Classification:** ${up("o_class")}`);
}

function genClose() {
  if (!cek(["c_tiket", "c_penyebab", "c_act", "c_rfo"])) return;
  const act = val("c_act");
  if (!ACTSOL.includes(act)) {
    $("c_act").classList.add("err");
    msg.textContent = "Kode Actsol harus dipilih dari daftar yang muncul.";
    return;
  }
  tampil(
`Moban close kak @survSO2_1

**Tiket :** ${mono(up("c_tiket"))}
**Penyebab :** ${up("c_penyebab")}
**Incident Domain:** ${domainFor(act)}
**Kode Actsol :** ${act}
**Penyambungan :** ${up("c_sambung")}
**RFO :** ${up("c_rfo")}`);
}

function clearAll() {
  document.querySelectorAll("#formOpen input, #formOpen textarea, #formClose input, #formClose textarea")
    .forEach(el => { el.value = ""; el.classList.remove("err"); });
  $("c_sambung").value = "";
  $("c_domain").value = "";
  $("domWrap").classList.add("hidden");
  mode.value = "";
  $("formOpen").classList.add("hidden");
  $("formClose").classList.add("hidden");
  hasil.value = "";
  outCard.classList.add("hidden");
  msg.textContent = "";
  window.scrollTo({top: 0, behavior: "smooth"});
}

async function salin() {
  const teks = hasil.value;
  try {
    await navigator.clipboard.writeText(teks);
  } catch (e) {
    hasil.select();
    document.execCommand("copy");
    window.getSelection().removeAllRanges();
  }
  $("btnCopy").textContent = "TERSALIN ✓";
  setTimeout(() => $("btnCopy").textContent = "SALIN TEXT", 1800);
}

/* Dropdown Kode Actsol: bisa diketik, langsung terfilter */
const act = $("c_act"), list = $("actList");
let idx = -1;

function render() {
  const q = act.value.toLowerCase().trim();
  const hit = ACTSOL.filter(a => a.toLowerCase().includes(q));
  list.innerHTML = "";
  idx = -1;
  if (!hit.length) {
    list.innerHTML = '<div class="none">Tidak ada pilihan</div>';
  } else {
    hit.forEach(a => {
      const d = document.createElement("div");
      d.textContent = a;
      d.addEventListener("mousedown", e => { e.preventDefault(); pilih(a); });
      list.appendChild(d);
    });
  }
  list.classList.remove("hidden");
}
/* Incident Domain otomatis berdasarkan Kode Actsol */
const DOMAIN_MAP = {
  "ASGMS082 GAMAS - OLT - PLN ON": "GAMAS - OLT - CATUAN PLN OFF"
};
const domainFor = a => {
  a = (a || "").trim();
  if (!a || !ACTSOL.includes(a)) return "";
  if (DOMAIN_MAP[a]) return DOMAIN_MAP[a];            /* pengecualian manual */
  if (a === "CANCEL") return "TSEL - TELKOM - CANCEL TIKET";
  return a.replace(/^\S+\s+/, "").trim();             /* nama actsol tanpa kode */
};
function updateDomain() {
  const d = domainFor(act.value.trim());
  $("c_domain").value = d;
  $("domWrap").classList.toggle("hidden", !d);
}
function pilih(a) {
  act.value = a;
  updateDomain();
  act.classList.remove("err");
  list.classList.add("hidden");
}
act.addEventListener("input", () => { updateDomain(); render(); });
act.addEventListener("focus", render);
act.addEventListener("blur", () => setTimeout(() => list.classList.add("hidden"), 120));
act.addEventListener("keydown", e => {
  const items = [...list.querySelectorAll("div:not(.none)")];
  if (!items.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    idx = e.key === "ArrowDown" ? (idx + 1) % items.length : (idx - 1 + items.length) % items.length;
    items.forEach((d, i) => d.classList.toggle("act", i === idx));
    items[idx].scrollIntoView({block: "nearest"});
  } else if (e.key === "Enter") {
    e.preventDefault();
    pilih((items[idx >= 0 ? idx : 0]).textContent);
  } else if (e.key === "Escape") {
    list.classList.add("hidden");
  }
});

document.querySelectorAll("input,textarea").forEach(el =>
  el.addEventListener("input", () => el.classList.remove("err")));
</script>
</body>
</html>
